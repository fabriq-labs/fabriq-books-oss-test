[project]
name = "fabriq-integrations"
version = "0.1.0"
description = "Fabriq Books ERP forward sync (Airbyte + dbt) and sync HTTP service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "requests>=2.28.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "cryptography>=41.0.0",
  "dbt-core>=1.8.0,<1.12",
  "dbt-postgres>=1.8.0,<1.12",
  "psycopg2-binary>=2.9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
