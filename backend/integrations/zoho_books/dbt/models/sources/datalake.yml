version: 2

sources:
  - name: datalake
    description: "Airbyte-landed data from ERP systems"
    schema: datalake
    tables:
      - name: "zb_invoices"
        description: "Raw invoice data from Zoho Books via Airbyte"
        columns:
          - name: _airbyte_raw_id
            description: "Airbyte raw record ID"
          - name: invoice_id
            description: "Zoho invoice ID"
          - name: invoice_number
            description: "Zoho invoice number"
          - name: status
            description: "Invoice status"
          - name: total
            description: "Invoice total amount"
          - name: shipping_charge
            description: "Shipping cost"
          - name: unprocessed_payment_amount
            description: "Outstanding balance"
          - name: updated_time
            description: "Last update timestamp"
          - name: transaction_type
            description: "Transaction type"
          - name: type
            description: "Alternative type field"
          # Airbyte metadata columns
          - name: _airbyte_extracted_at
            description: "Airbyte extraction timestamp"
          - name: _airbyte_generation_id
            description: "Airbyte generation ID"
          - name: _airbyte_meta
            description: "Airbyte metadata"
      
      - name: "zb_sales_orders"
        description: "Raw sales order data from Zoho Books via Airbyte"
        columns:
          - name: _airbyte_raw_id
            description: "Airbyte raw record ID"
          - name: salesorder_id
            description: "Zoho sales order ID"
          - name: salesorder_number
            description: "Sales order number"
          - name: date
            description: "Sales order date"
          - name: customer_id
            description: "Zoho customer ID"
          - name: customer_name
            description: "Customer name"
          - name: status
            description: "Sales order status"
          - name: total
            description: "Total amount"
          - name: notes
            description: "Notes/remarks"
          - name: payment_terms
            description: "Payment terms"
          - name: shipping_charge
            description: "Shipping cost"
          - name: updated_time
            description: "Last update timestamp"
          - name: _airbyte_extracted_at
          - name: _airbyte_generation_id
          - name: _airbyte_meta
      
      - name: "zb_customer_payments"
        description: "Raw payment data from Zoho Books via Airbyte"
        columns:
          - name: _airbyte_raw_id
            description: "Airbyte raw record ID"
          - name: payment_id
            description: "Zoho payment ID"
          - name: payment_number
            description: "Payment number/reference"
          - name: date
            description: "Payment date"
          - name: customer_id
            description: "Zoho customer ID"
          - name: customer_name
            description: "Customer name"
          - name: invoice_id
            description: "Related invoice ID (if any)"
          - name: invoice_number
            description: "Related invoice number"
          - name: amount
            description: "Payment amount"
          - name: payment_mode
            description: "Payment method"
          - name: currency_id
            description: "Currency ID"
          - name: exchange_rate
            description: "Exchange rate"
          - name: notes
            description: "Payment notes"
          - name: status
            description: "Payment status"
          - name: updated_time
            description: "Last update timestamp"
          - name: _airbyte_extracted_at
          - name: _airbyte_generation_id
          - name: _airbyte_meta
      
      - name: "zb_bills"
        description: "Raw bill data from Zoho Books via Airbyte (purchase invoices)"
        columns:
          - name: _airbyte_raw_id
            description: "Airbyte raw record ID"
          - name: bill_id
            description: "Zoho bill ID"
          - name: bill_number
            description: "Zoho bill number"
          - name: status
            description: "Bill status"
          - name: total
            description: "Bill total amount"
          - name: unprocessed_payment_amount
            description: "Outstanding balance"
          - name: vendor_id
            description: "Zoho vendor ID"
          - name: vendor_name
            description: "Vendor name"
          - name: date
            description: "Bill date"
          - name: due_date
            description: "Due date"
          - name: reference_number
            description: "Reference number"
          - name: last_modified_time
            description: "Last update timestamp"
          - name: created_time
            description: "Creation timestamp"
          - name: transaction_type
            description: "Transaction type"
          - name: type
            description: "Alternative type field"
          - name: tds_total
            description: "TDS total"
          - name: is_uber_bill
            description: "Is Uber bill"
          - name: is_tally_bill
            description: "Is Tally bill"
          - name: _airbyte_extracted_at
          - name: _airbyte_generation_id
          - name: _airbyte_meta
      
      - name: "zb_contacts"
        description: "Raw contact data from Zoho Books via Airbyte (includes both customers and vendors)"
        columns:
          - name: _airbyte_raw_id
            description: "Airbyte raw record ID"
          - name: contact_id
            description: "Zoho contact ID"
          - name: contact_name
            description: "Contact name"
          - name: contact_type
            description: "Contact type: 'customer' or 'vendor'"
          - name: customer_name
            description: "Customer name (if contact_type = customer)"
          - name: vendor_name
            description: "Vendor name (if contact_type = vendor)"
          - name: company_name
            description: "Company name"
          - name: email
            description: "Email address"
          - name: phone
            description: "Phone number"
          - name: mobile
            description: "Mobile number"
          - name: status
            description: "Contact status"
          - name: website
            description: "Website URL"
          - name: pan_no
            description: "PAN number (tax ID)"
          - name: created_time
            description: "Creation timestamp"
          - name: last_modified_time
            description: "Last modification timestamp"
          - name: _airbyte_extracted_at
          - name: _airbyte_generation_id
          - name: _airbyte_meta
      
      - name: "zb_items"
        description: "Raw item/product data from Zoho Books via Airbyte"
        columns:
          - name: _airbyte_raw_id
            description: "Airbyte raw record ID"
          - name: item_id
            description: "Zoho item ID"
          - name: name
            description: "Item name"
          - name: sku
            description: "SKU/item code"
          - name: description
            description: "Item description"
          - name: rate
            description: "Unit price/rate"
          - name: unit
            description: "Unit of measure"
          - name: item_type
            description: "Item type (goods, service, etc.)"
          - name: status
            description: "Item status (active, inactive)"
          - name: stock_on_hand
            description: "Stock on hand quantity"
          - name: reorder_level
            description: "Reorder level"
          - name: reorder_quantity
            description: "Reorder quantity"
          - name: created_time
            description: "Creation timestamp"
          - name: last_modified_time
            description: "Last modification timestamp"
          - name: _airbyte_extracted_at
          - name: _airbyte_generation_id
          - name: _airbyte_meta
      
      - name: "zb_accounts"
        description: "Raw chart of accounts data from Zoho Books via Direct API"
        columns:
          - name: _airbyte_raw_id
            description: "Airbyte-style raw record ID"
          - name: account_id
            description: "Zoho account ID"
          - name: account_name
            description: "Account name"
          - name: account_type
            description: "Account type (e.g., asset, liability, income, expense)"
          - name: account_code
            description: "Account code/number"
          - name: description
            description: "Account description"
          - name: is_system_account
            description: "Whether this is a system account"
          - name: is_active
            description: "Whether account is active"
          - name: parent_account_id
            description: "Parent account ID (for hierarchical accounts)"
          - name: created_time
            description: "Creation timestamp"
          - name: last_modified_time
            description: "Last modification timestamp"
          - name: _airbyte_extracted_at
          - name: _airbyte_generation_id
          - name: _airbyte_meta