name: 'fabriq_integrations'
version: '1.0.0'
config-version: 2

profile: 'fabriq_integrations'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  source_table_prefix: "{{ env_var('DBT_SOURCE_TABLE_PREFIX', 'zoho') }}"
  org_id: "{{ env_var('org_id', 'org_default') }}"
  force_process_all: false  # Set to true to process all records (bypass incremental filter)

models:
  fabriq_integrations:
    # Staging models - copy-only from source
    staging:
      +materialized: view
      +custom_schema: datalake

    # Integration metadata models
    integrations:
      +materialized: table
      +custom_schema: datalake
      # Note: source_system table is managed by Prisma, not DBT

    # Normalized models in public schema
    normalized:
      +materialized: incremental
      +custom_schema: public
      invoice:
        # Incremental based on source_updated_at
        +incremental_strategy: merge
        +unique_key: source_record_id
        +on_schema_change: append_new_columns
      sales_order:
        # Incremental based on source_updated_at
        +incremental_strategy: merge
        +unique_key: source_record_id
        +on_schema_change: append_new_columns
      payment_receipt:
        # Incremental based on source_updated_at
        +incremental_strategy: merge
        +unique_key: source_record_id
        +on_schema_change: append_new_columns
