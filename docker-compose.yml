# Single container: nginx + Node + Python sync. Database is external only (DATABASE_URL in backend/.env).
# Do not set USE_EMBEDDED_PG=true — that starts Postgres inside the image. For embedded PG, use docker-compose.embedded-pg.yml.
# Sample: embedded PostgreSQL — frontend + backend + nginx + Postgres in one container.
# Monorepo: build context includes backend/ and frontend-0/. See docs/infrastructure/BUILD_AND_DEPLOY.md.
#
# Optional build-args (for /app/build-info.json): SOURCE_REF, SOURCE_COMMIT, SOURCE_COMMIT_DATE,
# SOURCE_COMMIT_MESSAGE, CACHEBUST — e.g. SOURCE_COMMIT=$(git rev-parse HEAD) docker compose build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fabriq:latest
    env_file:
      - .env
    volumes:
      # Same file on disk for Python run_dbt.py (loads quickbooks/.env / zoho .env — symlinked in start-sync-service.sh)
      - .env:/app/backend/.env:ro
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      PORT: "8080"
      USE_EMBEDDED_PG: "false"
      NODE_ENV: "development"
      # In-container backend must call the sync service on 8081 (not nginx 8080; localhost in .env is wrong inside Docker)
      INTEGRATION_SYNC_URL: "http://127.0.0.1:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
