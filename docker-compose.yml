# nginx + Node. Database is external (DATABASE_URL).
# For Postgres inside the container, use docker-compose.embedded-pg.yml.
# Build context includes backend/ and frontend-0/. See docs/infrastructure/BUILD_AND_DEPLOY.md.
#
# Optional build-args (for /app/build-info.json): SOURCE_REF, SOURCE_COMMIT, SOURCE_COMMIT_DATE,
# SOURCE_COMMIT_MESSAGE, CACHEBUST — e.g. SOURCE_COMMIT=$(git rev-parse HEAD) docker compose build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kernel:latest
    env_file:
      - .env
    volumes:
      - .env:/app/backend/.env:ro
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      USE_EMBEDDED_PG: "false"
      NODE_ENV: "development"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
