# Dev stack: single container (frontend + backend + nginx + PostgreSQL)
# Use from repo root after cloning backend/ and frontend-1/ (see docs/BUILD_AND_DEPLOY.md)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: fabriq-dev:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      JWT_SECRET: "${JWT_SECRET:-dev-secret}"
      NODE_ENV: "development"
    volumes:
      # Persist PostgreSQL data between runs
      - fabriq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  fabriq_pgdata:
