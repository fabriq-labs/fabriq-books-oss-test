# Embedded PostgreSQL: single container (frontend + backend + nginx + in-container Postgres).
# Same Dockerfile as external-PG; use USE_EMBEDDED_PG=true to run embedded DB.
# Use from repo root after cloning backend/ and frontend-1/ (see docs/BUILD_AND_DEPLOY.md).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fabriq:latest
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "5432:5432"   # PostgreSQL (host + external; ensure firewall allows if needed)
    environment:
      PORT: "8080"
      USE_EMBEDDED_PG: "true"
      NODE_ENV: "development"
    volumes:
      - fabriq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  fabriq_pgdata:
