# Sample: embedded PostgreSQL — frontend + backend + nginx + Postgres in one container.
# Monorepo: build context includes backend/ and frontend-1/. See docs/BUILD_AND_DEPLOY.md.
#
# Optional build-args (for /app/build-info.json): SOURCE_REF, SOURCE_COMMIT, SOURCE_COMMIT_DATE,
# SOURCE_COMMIT_MESSAGE, CACHEBUST — e.g. SOURCE_COMMIT=$(git rev-parse HEAD) docker compose build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fabriq:latest
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "5432:5432"   # PostgreSQL (host + external; ensure firewall allows if needed)
    environment:
      PORT: "8080"
      USE_EMBEDDED_PG: "true"
      NODE_ENV: "development"
    volumes:
      - fabriq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  fabriq_pgdata:
