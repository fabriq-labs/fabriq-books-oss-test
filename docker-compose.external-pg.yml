# Alias: same as default docker-compose.yml (external DATABASE_URL). Kept for existing scripts/docs.
# Prefer: docker compose up (uses backend/.env)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fabriq:latest
    env_file:
      - .env
    volumes:
      - .env:/app/backend/.env:ro
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      PORT: "8080"
      USE_EMBEDDED_PG: "false"
      INTEGRATION_SYNC_URL: "http://127.0.0.1:8081"

volumes: {}
