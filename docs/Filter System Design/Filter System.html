<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filter System — Fabriq Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #7028a0;
  --primary-50: #f5ebf9;
  --primary-100: #e8d4f2;
  --primary-200: #d1a9e4;
  --primary-300: #ba7fd6;
  --primary-600: #7028a0;
  --primary-700: #591e80;
  --border: hsl(214.3 31.8% 91.4%);
  --muted: hsl(210 40% 96.1%);
  --muted-fg: hsl(215.4 16.3% 46.9%);
  --radius: 8px;
  --sidebar-bg: hsl(273,60%,98%);
  --sidebar-border: hsl(273,30%,90%);
  --sidebar-hover: hsl(273,30%,95%);
  --sidebar-fg: hsl(273,30%,25%);
}
body { font-family: 'Lato', sans-serif; background: #f9fafb; color: #111827; overflow: hidden; height: 100vh; font-size: 14px; }
* { scrollbar-width: thin; scrollbar-color: rgba(156,163,175,.5) transparent; }
*::-webkit-scrollbar { width: 5px; height: 5px; }
*::-webkit-scrollbar-thumb { background: rgba(156,163,175,.4); border-radius: 3px; }

/* Modal overlay */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 16px;
}
.modal-content {
  background: #fff; border-radius: 10px;
  box-shadow: 0 20px 60px rgba(0,0,0,.18);
  width: 100%; max-width: 620px;
  max-height: 90vh; overflow-y: auto;
  padding: 24px;
}

/* Token input */
.token-wrap {
  min-height: 36px; border: 1px solid var(--border); border-radius: 6px;
  background: #F5EDFB; padding: 3px 6px;
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  cursor: text; flex: 1;
}
.token-wrap:focus-within { outline: 2px solid var(--primary); outline-offset: 0; }
.token {
  background: var(--primary-100); color: var(--primary-700);
  border-radius: 4px; padding: 1px 6px; font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 3px;
}
.token-remove {
  background: none; border: none; cursor: pointer; padding: 0; line-height: 1;
  color: var(--primary-300); display: flex; align-items: center;
}
.token-remove:hover { color: var(--primary-700); }
.token-input {
  border: none; background: transparent; outline: none;
  font-family: 'Lato', sans-serif; font-size: 13px; color: #374151;
  min-width: 80px; flex: 1; height: 24px; padding: 0 2px;
}

/* Multi-select dropdown */
.ms-wrap { position: relative; flex: 1; }
.ms-trigger {
  min-height: 36px; border: 1px solid var(--border); border-radius: 6px;
  background: #F5EDFB; padding: 3px 28px 3px 6px;
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  cursor: pointer; width: 100%;
}
.ms-trigger:focus { outline: 2px solid var(--primary); }
.ms-arrow {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  pointer-events: none; color: var(--muted-fg);
}
.ms-dropdown {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: #fff; border: 1px solid var(--border);
  border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.1);
  z-index: 300; overflow: hidden;
}
.ms-search {
  padding: 8px; border-bottom: 1px solid var(--border);
}
.ms-search input {
  width: 100%; border: 1px solid var(--border); border-radius: 5px;
  padding: 5px 10px; font-size: 12px; font-family: 'Lato', sans-serif;
  outline: none;
}
.ms-search input:focus { border-color: var(--primary); }
.ms-list { max-height: 180px; overflow-y: auto; padding: 4px 0; }
.ms-item {
  padding: 7px 12px; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; gap: 8px; color: #374151;
}
.ms-item:hover { background: var(--primary-50); }
.ms-item.selected { background: #F5EDFB; font-weight: 600; color: var(--primary-700); }
.ms-checkbox {
  width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--border);
  background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.ms-checkbox.checked { background: var(--primary); border-color: var(--primary); }

/* Filter badge */
.fbadge {
  display: inline-flex; align-items: center; gap: 5px;
  background: #EDE9FE; color: #3730a3; border-radius: 9999px;
  padding: 3px 10px; font-size: 12px; font-weight: 600;
}
.fbadge-or {
  background: var(--primary-100); color: var(--primary-700);
}
.fbadge-x {
  background: none; border: none; cursor: pointer; padding: 0;
  display: flex; align-items: center; color: #7c3aed;
  opacity: .7; margin-left: 1px;
}
.fbadge-x:hover { opacity: 1; }

/* Select trigger */
.sel-trigger {
  height: 36px; border: 1px solid var(--border); border-radius: 6px;
  background: #F5EDFB; padding: 0 28px 0 10px;
  font-size: 13px; font-family: 'Lato', sans-serif;
  color: #374151; cursor: pointer; white-space: nowrap;
  display: flex; align-items: center; position: relative;
  min-width: 0;
}
.sel-trigger:focus { outline: 2px solid var(--primary); }

/* Btn */
.btn { font-family: 'Lato',sans-serif; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; transition: all .15s; white-space: nowrap; }
.btn-primary { background: var(--primary); color: #fff; padding: 0 16px; height: 36px; }
.btn-primary:hover { background: var(--primary-700); }
.btn-outline { background: #fff; color: #374151; border: 1px solid var(--border); padding: 0 14px; height: 36px; }
.btn-outline:hover { background: var(--primary-50); }
.btn-ghost { background: transparent; color: var(--muted-fg); padding: 0 8px; height: 32px; }
.btn-ghost:hover { background: var(--muted); }
.btn-purple-outline { background: #fff; color: var(--primary); border: 1px solid var(--primary-200); padding: 0 12px; height: 32px; font-size: 12px; }
.btn-purple-outline:hover { background: var(--primary-50); }

/* Table */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { height: 44px; padding: 0 14px; text-align: left; font-size: 12px; font-weight: 600; color: var(--muted-fg); border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 12px 14px; border-bottom: 1px solid #f3f4f6; color: #374151; }
.tbl tr:hover td { background: #fafafa; }

/* Date inputs */
.date-input {
  height: 36px; border: 1px solid var(--border); border-radius: 6px;
  background: #F5EDFB; padding: 0 10px; font-size: 13px;
  font-family: 'Lato', sans-serif; color: #374151;
  flex: 1; outline: none;
}
.date-input:focus { border-color: var(--primary); }

/* AND separator */
.and-pill {
  font-size: 10px; font-weight: 700; letter-spacing: .06em;
  color: var(--muted-fg); background: var(--muted);
  border-radius: 3px; padding: 1px 5px;
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ── Icons ────────────────────────────────────────────────────────────
const Ico = ({ path, size=16, sw=1.75 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
    stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"
    style={{flexShrink:0}}>
    {[].concat(path).map((d,i) => <path key={i} d={d} />)}
  </svg>
);
const ICONS = {
  menu: "M4 6h16M4 12h16M4 18h16",
  filter: ["M22 3H2l8 9.46V19l4 2v-8.54L22 3"],
  x: "M18 6L6 18M6 6l12 12",
  plus: "M12 5v14M5 12h14",
  chevDown: "M6 9l6 6 6-6",
  chevRight: "M9 18l6-6-6-6",
  check: "M20 6L9 17l-5-5",
  search: ["M11 17.25a6.25 6.25 0 110-12.5 6.25 6.25 0 010 12.5z","M16 16l4.5 4.5"],
  bell: ["M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9","M13.73 21a2 2 0 01-3.46 0"],
  calendar: ["M8 2v4","M16 2v4","M3 10h18","M3 6a2 2 0 012-2h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6z"],
  cart: ["M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z","M3 6h18","M16 10a4 4 0 01-8 0"],
  purchases: "M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z",
  dashboard: ["M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z","M9 22V12h6v10"],
  accounting: ["M12 1v22","M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"],
  investments: ["M23 6l-9.5 9.5-5-5L1 18","M17 6h6v6"],
  reports: ["M18 20V10","M12 20V4","M6 20v-6"],
  bot: ["M12 2a3 3 0 013 3v1h2a2 2 0 012 2v8a2 2 0 01-2 2H7a2 2 0 01-2-2V8a2 2 0 012-2h2V5a3 3 0 013-3z","M9 12h.01M15 12h.01"],
  database: ["M12 2a9 2 0 100 4 9 2 0 000-4z","M21 12a9 2 0 11-18 0","M3 6v6c0 1.1 4 2 9 2s9-.9 9-2V6","M3 12v6c0 1.1 4 2 9 2s9-.9 9-2v-6"],
  settings: ["M12 15a3 3 0 100-6 3 3 0 000 6z","M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"],
};

// ── Metadata (simulated field configs) ───────────────────────────────
const META = {
  status:        { displayName: 'Status',        columnType: 'select', options: ['Draft','Pending','Approved','Rejected','In Review','Completed','Cancelled'] },
  supplier_name: { displayName: 'Supplier',      columnType: 'select', options: ['Acme Corp','TechHub','GlobalSupply','MegaMart','PrimeParts','EliteVendors','SwiftLogistics'] },
  description:   { displayName: 'Description',   columnType: 'text' },
  po_number:     { displayName: 'PO Number',      columnType: 'text' },
  department:    { displayName: 'Department',     columnType: 'select', options: ['Engineering','Finance','Operations','HR','Marketing','Sales','Legal'] },
  amount:        { displayName: 'Amount',         columnType: 'number' },
};

// ── Sample table data ─────────────────────────────────────────────────
const ORDERS = [
  { id:'PO-2024-001', supplier:'Acme Corp',       amount:'₹48,500', date:'12 Apr 2024', status:'Approved',   dept:'Engineering' },
  { id:'PO-2024-002', supplier:'TechHub',          amount:'₹1,20,000', date:'15 Apr 2024', status:'Pending',    dept:'IT' },
  { id:'PO-2024-003', supplier:'GlobalSupply',     amount:'₹32,750', date:'18 Apr 2024', status:'Draft',      dept:'Operations' },
  { id:'PO-2024-004', supplier:'MegaMart',         amount:'₹8,200',  date:'19 Apr 2024', status:'Approved',   dept:'Finance' },
  { id:'PO-2024-005', supplier:'PrimeParts',       amount:'₹67,000', date:'20 Apr 2024', status:'In Review',  dept:'Engineering' },
  { id:'PO-2024-006', supplier:'EliteVendors',     amount:'₹15,300', date:'21 Apr 2024', status:'Rejected',   dept:'HR' },
  { id:'PO-2024-007', supplier:'SwiftLogistics',   amount:'₹93,000', date:'22 Apr 2024', status:'Approved',   dept:'Operations' },
  { id:'PO-2024-008', supplier:'Acme Corp',        amount:'₹22,400', date:'23 Apr 2024', status:'Pending',    dept:'Marketing' },
  { id:'PO-2024-009', supplier:'TechHub',          amount:'₹5,800',  date:'23 Apr 2024', status:'Draft',      dept:'Finance' },
  { id:'PO-2024-010', supplier:'GlobalSupply',     amount:'₹1,45,000', date:'24 Apr 2024', status:'In Review', dept:'Engineering' },
];

// ── Token Input ───────────────────────────────────────────────────────
function TokenInput({ tokens, onChange, placeholder='Type and press Enter…' }) {
  const [draft, setDraft] = useState('');
  const inputRef = useRef(null);

  const addToken = (val) => {
    const v = val.trim().replace(/,$/, '').trim();
    if (!v) return;
    if (!tokens.includes(v)) onChange([...tokens, v]);
    setDraft('');
  };

  const handleKey = (e) => {
    if ((e.key === 'Enter' || e.key === ',') && draft.trim()) {
      e.preventDefault();
      addToken(draft);
    }
    if (e.key === 'Backspace' && !draft && tokens.length) {
      onChange(tokens.slice(0, -1));
    }
  };

  const handleBlur = () => { if (draft.trim()) addToken(draft); };

  return (
    <div className="token-wrap" onClick={() => inputRef.current?.focus()}>
      {tokens.map((t, i) => (
        <span key={i} className="token">
          {t}
          <button className="token-remove" onClick={(e) => { e.stopPropagation(); onChange(tokens.filter((_,j)=>j!==i)); }}>
            <Ico path={ICONS.x} size={10} sw={2.5} />
          </button>
        </span>
      ))}
      <input
        ref={inputRef}
        className="token-input"
        value={draft}
        onChange={e => setDraft(e.target.value)}
        onKeyDown={handleKey}
        onBlur={handleBlur}
        placeholder={tokens.length ? '' : placeholder}
      />
    </div>
  );
}

// ── Multi-Select Dropdown ─────────────────────────────────────────────
function MultiSelect({ options, selected, onChange, placeholder='Select…' }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const ref = useRef(null);

  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const filtered = options.filter(o => o.toLowerCase().includes(query.toLowerCase()));
  const toggle = (opt) => onChange(selected.includes(opt) ? selected.filter(s => s !== opt) : [...selected, opt]);

  return (
    <div className="ms-wrap" ref={ref}>
      <div className="ms-trigger" tabIndex={0} onClick={() => setOpen(o => !o)} onFocus={() => setOpen(true)}>
        {selected.length === 0
          ? <span style={{color:'#9ca3af', fontSize:13}}>{placeholder}</span>
          : selected.map((s, i) => (
              <span key={i} className="token">
                {s}
                <button className="token-remove" onClick={(e) => { e.stopPropagation(); toggle(s); }}>
                  <Ico path={ICONS.x} size={10} sw={2.5} />
                </button>
              </span>
            ))
        }
        <span className="ms-arrow"><Ico path={ICONS.chevDown} size={14} /></span>
      </div>
      {open && (
        <div className="ms-dropdown">
          <div className="ms-search">
            <input placeholder="Search…" value={query} onChange={e => setQuery(e.target.value)} autoFocus />
          </div>
          <div className="ms-list">
            {filtered.length === 0
              ? <div style={{padding:'8px 12px', color:'#9ca3af', fontSize:12}}>No results</div>
              : filtered.map(opt => (
                  <div key={opt} className={`ms-item${selected.includes(opt) ? ' selected' : ''}`} onClick={() => toggle(opt)}>
                    <span className={`ms-checkbox${selected.includes(opt) ? ' checked' : ''}`}>
                      {selected.includes(opt) && <Ico path={ICONS.check} size={9} sw={3} style={{color:'#fff'}} />}
                    </span>
                    {opt}
                  </div>
                ))
            }
          </div>
        </div>
      )}
    </div>
  );
}

// ── Operator Select ───────────────────────────────────────────────────
function OperatorSelect({ value, onChange, colType }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  const ops = colType === 'select'
    ? [{v:'eq',l:'Equals'},{v:'neq',l:'Not equals'},{v:'is_null',l:'Is empty'},{v:'is_not_null',l:'Is not empty'}]
    : colType === 'number'
    ? [{v:'eq',l:'Equals'},{v:'neq',l:'Not equals'},{v:'gt',l:'Greater than'},{v:'gte',l:'≥'},{v:'lt',l:'Less than'},{v:'lte',l:'≤'},{v:'is_null',l:'Is empty'},{v:'is_not_null',l:'Is not empty'}]
    : [{v:'eq',l:'Equals'},{v:'neq',l:'Not equals'},{v:'contains',l:'Contains'},{v:'ncontains',l:'Not contains'},{v:'starts_with',l:'Starts with'},{v:'is_null',l:'Is empty'},{v:'is_not_null',l:'Is not empty'}];

  const label = ops.find(o => o.v === value)?.l || value;
  return (
    <div style={{position:'relative', flexShrink:0}} ref={ref}>
      <div className="sel-trigger" style={{width:130}} onClick={() => setOpen(o => !o)}>
        <span style={{flex:1, overflow:'hidden', textOverflow:'ellipsis'}}>{label}</span>
        <span style={{position:'absolute', right:6, top:'50%', transform:'translateY(-50%)', color:'#9ca3af'}}>
          <Ico path={ICONS.chevDown} size={13} />
        </span>
      </div>
      {open && (
        <div style={{position:'absolute', top:'calc(100% + 4px)', left:0, width:160, background:'#fff', border:'1px solid #e2e8f0', borderRadius:6, boxShadow:'0 4px 12px rgba(0,0,0,.1)', zIndex:400, padding:'4px 0'}}>
          {ops.map(op => (
            <div key={op.v}
              onClick={() => { onChange(op.v); setOpen(false); }}
              style={{padding:'7px 12px', fontSize:13, cursor:'pointer', color: value===op.v ? '#7028a0' : '#374151', fontWeight: value===op.v ? 600 : 400, background: value===op.v ? '#f5ebf9' : 'transparent'}}
              onMouseEnter={e => { if (value!==op.v) e.currentTarget.style.background='#f9fafb'; }}
              onMouseLeave={e => { if (value!==op.v) e.currentTarget.style.background='transparent'; }}
            >
              {op.l}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Field Select ──────────────────────────────────────────────────────
function FieldSelect({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  const label = value ? META[value]?.displayName : null;
  return (
    <div style={{position:'relative', flexShrink:0}} ref={ref}>
      <div className="sel-trigger" style={{width:148}} onClick={() => setOpen(o => !o)}>
        <span style={{flex:1, overflow:'hidden', textOverflow:'ellipsis', color: label ? '#374151' : '#9ca3af'}}>
          {label || 'Select field'}
        </span>
        <span style={{position:'absolute', right:6, top:'50%', transform:'translateY(-50%)', color:'#9ca3af'}}>
          <Ico path={ICONS.chevDown} size={13} />
        </span>
      </div>
      {open && (
        <div style={{position:'absolute', top:'calc(100% + 4px)', left:0, width:180, background:'#fff', border:'1px solid #e2e8f0', borderRadius:6, boxShadow:'0 4px 12px rgba(0,0,0,.1)', zIndex:400, padding:'4px 0'}}>
          {Object.entries(META).map(([key, col]) => (
            <div key={key}
              onClick={() => { onChange(key); setOpen(false); }}
              style={{padding:'7px 12px', fontSize:13, cursor:'pointer', color: value===key ? '#7028a0' : '#374151', fontWeight: value===key ? 600 : 400, background: value===key ? '#f5ebf9' : 'transparent'}}
              onMouseEnter={e => { if (value!==key) e.currentTarget.style.background='#f9fafb'; }}
              onMouseLeave={e => { if (value!==key) e.currentTarget.style.background='transparent'; }}
            >
              {col.displayName}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Value Input (dispatches to token / multi-select based on type) ────
function ValueInput({ field, operator, values, onChange }) {
  const isNull = operator === 'is_null' || operator === 'is_not_null';
  if (isNull) return (
    <div style={{flex:1, height:36, display:'flex', alignItems:'center', padding:'0 10px', background:'#f9fafb', border:'1px dashed #e2e8f0', borderRadius:6, color:'#9ca3af', fontSize:12, fontStyle:'italic'}}>
      No value needed
    </div>
  );

  if (!field) return (
    <div style={{flex:1, height:36, background:'#f9fafb', border:'1px dashed #e2e8f0', borderRadius:6}} />
  );

  const col = META[field];
  if (col.columnType === 'select') {
    return <MultiSelect options={col.options} selected={values} onChange={onChange} placeholder={`Select ${col.displayName}…`} />;
  }
  return <TokenInput tokens={values} onChange={onChange} placeholder={`Value — press Enter to add`} />;
}

// ── Filter Row ────────────────────────────────────────────────────────
function FilterRow({ row, index, onUpdate, onRemove, isLast }) {
  const handleFieldChange = (field) => {
    onUpdate(index, { field, operator: 'eq', values: [] });
  };
  const handleOperatorChange = (op) => {
    const isNull = op === 'is_null' || op === 'is_not_null';
    onUpdate(index, { ...row, operator: op, values: isNull ? [] : row.values });
  };

  return (
    <div style={{display:'flex', alignItems:'flex-start', gap:8}}>
      {/* AND pill shown between rows */}
      <div style={{display:'flex', flexDirection:'column', alignItems:'center', paddingTop:8, width:40, flexShrink:0}}>
        {index > 0
          ? <span className="and-pill">AND</span>
          : <span style={{fontSize:11, color:'#9ca3af', fontWeight:600}}>WHERE</span>
        }
      </div>

      <FieldSelect value={row.field} onChange={handleFieldChange} />

      {row.field && (
        <OperatorSelect
          value={row.operator}
          onChange={handleOperatorChange}
          colType={META[row.field]?.columnType}
        />
      )}

      <ValueInput
        field={row.field}
        operator={row.operator}
        values={row.values}
        onChange={(vals) => onUpdate(index, { ...row, values: vals })}
      />

      <button
        className="btn btn-ghost"
        style={{flexShrink:0, color:'#d1d5db', marginTop:2}}
        onClick={() => onRemove(index)}
        title="Remove row"
      >
        <Ico path={ICONS.x} size={14} sw={2} />
      </button>
    </div>
  );
}

// ── Date Range Row ────────────────────────────────────────────────────
function DateRangeRow({ dateFrom, dateTo, onChangeFrom, onChangeTo }) {
  return (
    <div style={{display:'flex', alignItems:'center', gap:8, marginTop:4}}>
      <div style={{display:'flex', alignItems:'center', paddingTop:0, width:40, flexShrink:0, justifyContent:'center'}}>
        <span className="and-pill">AND</span>
      </div>
      <div style={{background:'#F5EDFB', border:'1px solid #e2e8f0', borderRadius:6, padding:'6px 12px', display:'flex', alignItems:'center', gap:8, flex:1}}>
        <Ico path={ICONS.calendar} size={14} style={{color:'#7028a0', flexShrink:0}} />
        <span style={{fontSize:12, fontWeight:600, color:'#374151', whiteSpace:'nowrap'}}>Date range</span>
        <input type="date" className="date-input" value={dateFrom} onChange={e => onChangeFrom(e.target.value)}
          style={{flex:1, minWidth:120}} />
        <span style={{color:'#9ca3af', fontSize:12}}>→</span>
        <input type="date" className="date-input" value={dateTo} onChange={e => onChangeTo(e.target.value)}
          style={{flex:1, minWidth:120}} />
      </div>
      <button className="btn btn-ghost" style={{flexShrink:0, color:'#d1d5db'}}
        onClick={() => { onChangeFrom(''); onChangeTo(''); }}
        title="Clear date range">
        <Ico path={ICONS.x} size={14} sw={2} />
      </button>
    </div>
  );
}

// ── Filter Modal ──────────────────────────────────────────────────────
function FilterModal({ onClose, onApply, initial }) {
  const [rows, setRows] = useState(initial.rows?.length
    ? initial.rows
    : [{ field: '', operator: 'eq', values: [] }]);
  const [dateFrom, setDateFrom] = useState(initial.dateFrom || '');
  const [dateTo, setDateTo] = useState(initial.dateTo || '');

  const updateRow = (idx, newRow) => setRows(r => r.map((row, i) => i === idx ? newRow : row));
  const removeRow = (idx) => setRows(r => r.length > 1 ? r.filter((_,i) => i !== idx) : r);
  const addRow = () => setRows(r => [...r, { field: '', operator: 'eq', values: [] }]);

  const handleApply = () => {
    const validRows = rows.filter(r =>
      r.field && (r.values.length > 0 || r.operator === 'is_null' || r.operator === 'is_not_null')
    );
    onApply({ rows: validRows, dateFrom, dateTo });
    onClose();
  };

  const activeCount = rows.filter(r => r.field && (r.values.length > 0 || r.operator === 'is_null' || r.operator === 'is_not_null')).length
    + (dateFrom && dateTo ? 1 : 0);

  return (
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-content">
        {/* Header */}
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20}}>
          <div>
            <div style={{fontFamily:'Poppins,sans-serif', fontWeight:600, fontSize:17, color:'#111827', display:'flex', alignItems:'center', gap:8}}>
              <Ico path={ICONS.filter} size={16} style={{color:'#7028a0'}} />
              Filters
            </div>
            <div style={{fontSize:12, color:'#9ca3af', marginTop:2}}>
              Multiple values for the same field are combined with <strong style={{color:'#7028a0'}}>OR</strong>. Different fields use <strong style={{color:'#374151'}}>AND</strong>.
            </div>
          </div>
          <button className="btn btn-ghost" onClick={onClose} style={{color:'#6b7280', padding:'0 6px'}}>
            <Ico path={ICONS.x} size={16} />
          </button>
        </div>

        {/* Rows */}
        <div style={{display:'flex', flexDirection:'column', gap:10, marginBottom:12}}>
          {rows.map((row, i) => (
            <FilterRow key={i} row={row} index={i} onUpdate={updateRow} onRemove={removeRow} isLast={i === rows.length - 1} />
          ))}

          {/* Date range */}
          <DateRangeRow dateFrom={dateFrom} dateTo={dateTo} onChangeFrom={setDateFrom} onChangeTo={setDateTo} />
        </div>

        {/* Add filter */}
        <button className="btn btn-purple-outline" onClick={addRow} style={{marginBottom:24, marginLeft:48}}>
          <Ico path={ICONS.plus} size={13} />
          Add filter row
        </button>

        {/* Payload preview */}
        <PayloadPreview rows={rows} dateFrom={dateFrom} dateTo={dateTo} />

        {/* Footer */}
        <div style={{display:'flex', justifyContent:'flex-end', gap:8, marginTop:20, paddingTop:16, borderTop:'1px solid #f3f4f6'}}>
          <button className="btn btn-outline" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleApply}>
            Apply filters{activeCount > 0 ? ` (${activeCount})` : ''}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Payload Preview ───────────────────────────────────────────────────
function PayloadPreview({ rows, dateFrom, dateTo }) {
  const payload = buildPayload(rows, dateFrom, dateTo);
  if (!Object.keys(payload).length) return null;
  return (
    <div style={{background:'#f8f6fc', border:'1px solid #e8d4f2', borderRadius:6, padding:'10px 14px'}}>
      <div style={{fontSize:11, fontWeight:700, color:'#7028a0', textTransform:'uppercase', letterSpacing:'.06em', marginBottom:6}}>
        API payload preview
      </div>
      <pre style={{fontSize:11, color:'#374151', fontFamily:'monospace', whiteSpace:'pre-wrap', margin:0}}>
        {JSON.stringify(payload, null, 2)}
      </pre>
    </div>
  );
}

function buildPayload(rows, dateFrom, dateTo) {
  const grouped = {};
  rows.forEach(r => {
    if (!r.field) return;
    if (r.operator === 'is_null' || r.operator === 'is_not_null') {
      if (!grouped[r.field]) grouped[r.field] = [];
      grouped[r.field].push({ [r.operator]: null });
      return;
    }
    if (!r.values.length) return;
    if (!grouped[r.field]) grouped[r.field] = [];
    r.values.forEach(v => grouped[r.field].push({ [r.operator]: v }));
  });
  const out = {};
  Object.entries(grouped).forEach(([field, conds]) => {
    out[field] = conds.length === 1 ? conds[0] : { OR: conds };
  });
  if (dateFrom && dateTo) {
    out['date'] = { gte: dateFrom, lte: dateTo };
  }
  return out;
}

// ── Applied Filter Badges ─────────────────────────────────────────────
function FilterBadges({ filterState, onClear, onClearAll }) {
  const { rows, dateFrom, dateTo } = filterState;

  // Group rows by field
  const grouped = {};
  rows.forEach(r => {
    if (!r.field) return;
    if (r.operator === 'is_null' || r.operator === 'is_not_null') {
      if (!grouped[r.field]) grouped[r.field] = { operator: r.operator, values: [], isNull: true };
      return;
    }
    if (!r.values.length) return;
    if (!grouped[r.field]) grouped[r.field] = { operator: r.operator, values: [], isNull: false };
    grouped[r.field].values.push(...r.values);
  });

  const badges = Object.entries(grouped).map(([field, info]) => {
    const label = META[field]?.displayName || field;
    const opLabel = {
      eq: '=', neq: '≠', contains: 'contains', ncontains: 'not contains',
      starts_with: 'starts with', gt: '>', gte: '≥', lt: '<', lte: '≤',
      is_null: 'is empty', is_not_null: 'is not empty',
    }[info.operator] || info.operator;

    const valueStr = info.isNull
      ? opLabel
      : info.values.join(' OR ');

    return { field, label, opLabel, valueStr, isNull: info.isNull, multiVal: info.values.length > 1 };
  });

  const hasDate = dateFrom && dateTo;
  const total = badges.length + (hasDate ? 1 : 0);
  if (total === 0) return null;

  const fmt = (d) => {
    if (!d) return '';
    const [y,m,day] = d.split('-');
    return `${day}/${m}/${y}`;
  };

  return (
    <div style={{display:'flex', flexWrap:'wrap', gap:6, alignItems:'center', padding:'10px 0 2px'}}>
      {badges.map(({ field, label, opLabel, valueStr, isNull, multiVal }) => (
        <span key={field} className={`fbadge${multiVal ? ' fbadge-or' : ''}`}>
          <span style={{color:'#374151'}}>{label}</span>
          <span style={{color:'#6b7280', fontWeight:400, margin:'0 2px'}}>{isNull ? '' : opLabel}</span>
          <span style={{color:'#7028a0'}}>{valueStr}</span>
          <button className="fbadge-x" onClick={() => onClear(field)}>
            <Ico path={ICONS.x} size={10} sw={2.5} />
          </button>
        </span>
      ))}
      {hasDate && (
        <span className="fbadge">
          <span style={{color:'#374151'}}>Date</span>
          <span style={{color:'#6b7280', fontWeight:400, margin:'0 2px'}}>=</span>
          <span style={{color:'#7028a0'}}>{fmt(dateFrom)} → {fmt(dateTo)}</span>
          <button className="fbadge-x" onClick={() => onClear('__date__')}>
            <Ico path={ICONS.x} size={10} sw={2.5} />
          </button>
        </span>
      )}
      <button
        onClick={onClearAll}
        style={{background:'none', border:'none', cursor:'pointer', fontSize:12, color:'#7028a0', fontFamily:'Lato,sans-serif', fontWeight:600, textDecoration:'underline', padding:'0 4px'}}
      >
        Clear all
      </button>
    </div>
  );
}

  { id:'accounting', label:'Accounting', icon:'accounting' },

];

// ── Main App ──────────────────────────────────────────────────────────
function App() {
  const [collapsed, setCollapsed] = useState(false);
  const [modalOpen, setModalOpen] = useState(false);
  const [filterState, setFilterState] = useState({
    rows: [],
    dateFrom: '',
    dateTo: '',
  });

  const sideW = collapsed ? 48 : 210;

  // Apply filter: merge new rows
  const handleApply = (newState) => setFilterState(newState);

  const clearField = (field) => {
    if (field === '__date__') {
      setFilterState(s => ({ ...s, dateFrom: '', dateTo: '' }));
    } else {
      setFilterState(s => ({ ...s, rows: s.rows.filter(r => r.field !== field) }));
    }
  };

  const clearAll = () => setFilterState({ rows: [], dateFrom: '', dateTo: '' });

  if (filterState.dateFrom && filterState.dateTo) activeGroups.add('__date__');
  const activeCount = activeGroups.size;

  const filteredOrders = ORDERS;

  const hasBadges = activeCount > 0;

  return (
    <div style={{height:'100vh', display:'flex', flexDirection:'column', overflow:'hidden'}}>
      {/* TopBar */}
      <header style={{
        position:'fixed', top:0, left:0, right:0, height:56,
        background:'#fff', borderBottom:'1px solid #e2e8f0',
        display:'flex', alignItems:'center', padding:'0 16px', zIndex:50, gap:12,
      }}>
        <button onClick={() => setCollapsed(c => !c)} style={{background:'transparent', border:'none', cursor:'pointer', color:'#6b7280', display:'flex', padding:6, borderRadius:6}}>
          <Ico path={ICONS.menu} size={18} />
        </button>
        <div style={{fontFamily:'Poppins,sans-serif', fontWeight:700, fontSize:18, color:'#7028a0', letterSpacing:'-0.01em'}}>Fabriq</div>
        <div style={{flex:1}} />
        <button style={{background:'transparent', border:'none', cursor:'pointer', color:'#6b7280', display:'flex', padding:6, borderRadius:6, position:'relative'}}>
          <Ico path={ICONS.bell} size={18} />
          <span style={{position:'absolute', top:4, right:4, width:6, height:6, background:'#ef4444', borderRadius:'50%'}} />
        </button>
        <div style={{width:30, height:30, background:'#7028a0', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer'}}>
          <span style={{fontSize:11, fontWeight:700, color:'#fff'}}>AD</span>
        </div>
      </header>

      <Sidebar collapsed={collapsed} />

      {/* Main content */}
      <main style={{
        marginTop:56, marginLeft:sideW,
        transition:'margin-left .3s ease',
        flex:1, overflow:'auto', padding:'20px 24px',
      }}>
        {/* Page header */}
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom: hasBadges ? 4 : 16}}>

            <div style={{fontSize:11, color:'#9ca3af', fontWeight:600, textTransform:'uppercase', letterSpacing:'.04em', marginBottom:2}}>Purchases</div>
            <h1 style={{fontFamily:'Poppins,sans-serif', fontWeight:700, fontSize:20, color:'#111827'}}>Purchase orders</h1>
          </div>
          <div style={{display:'flex', gap:8, alignItems:'center'}}>
            {/* Filter button */}
            <button
              className="btn btn-outline"
              onClick={() => setModalOpen(true)}
              style={{position:'relative', color: activeCount > 0 ? '#7028a0' : '#374151', borderColor: activeCount > 0 ? '#d1a9e4' : undefined, background: activeCount > 0 ? '#f5ebf9' : '#fff'}}
            >
              <Ico path={ICONS.filter} size={14} />
              Filters
              {activeCount > 0 && (
                <span style={{
                  background:'#7028a0', color:'#fff', borderRadius:9999,
                  fontSize:10, fontWeight:700, padding:'1px 6px', lineHeight:1.4,
                }}>
                  {activeCount}

            <button className="btn btn-primary" style={{fontSize:13}}>
              <Ico path={ICONS.plus} size={14} />

        </div>

        <FilterBadges filterState={filterState} onClear={clearField} onClearAll={clearAll} />

        {/* Table card */}
        <div style={{background:'#fff', border:'1px solid #e2e8f0', borderRadius:8, boxShadow:'0 1px 2px rgba(0,0,0,.04)', marginTop: hasBadges ? 12 : 0, overflow:'hidden'}}>
          <table className="tbl">
            <thead>
              <tr style={{background:'#fafafa'}}>
                <th>PO number</th>
                <th>Supplier</th>
                <th>Department</th>

                <th>Status</th>

            </thead>

                <tr>

              {title:'Multi-select (dropdown fields)', body:'Dropdown stays open during selection. Each pick becomes a chip. Deselecting a chip removes that OR condition. Same field + same operator = OR group in the API payload.'},
              {title:'Applied badges', body:'Each badge shows all OR values joined by "OR". Clicking × on a badge clears ALL conditions for that field. Purple badges indicate multi-value OR conditions; indigo = single value.'},
            ].map(n => (
              <div key={n.title} style={{background:'#fffbeb', border:'1px solid #fde68a', borderRadius:6, padding:'10px 12px'}}>

                <div style={{fontSize:12, color:'#78350f', lineHeight:1.5}}>{n.body}</div>

            ))}

        </div>
      </main>

      {modalOpen && (
        <FilterModal
          onClose={() => setModalOpen(false)}
          onApply={handleApply}
          initial={filterState}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
