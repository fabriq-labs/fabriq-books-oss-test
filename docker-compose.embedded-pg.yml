# Postgres, nginx, and Node in one container. The database volume is fabriq_pgdata.
# First boot runs npm run setup:kernel. Prefer docker-compose.yml with an external DATABASE_URL.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kernel:latest
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "5432:5432"
    environment:
      PORT: "8080"
      USE_EMBEDDED_PG: "true"
      NODE_ENV: "development"
    volumes:
      - .env:/app/backend/.env:ro
      - kernel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  kernel_pgdata:
