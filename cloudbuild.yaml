# Build production image and push to GCR.
# The Dockerfile clones backend + frontend from GitHub using GH_TOKEN.
# Manual: gcloud builds submit --config=cloudbuild.yaml --substitutions="_GH_TOKEN=${GH_TOKEN}" .

steps:
  # Build Docker image (Dockerfile clones repos internally)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'GH_TOKEN=${_GH_TOKEN}'
      - '--build-arg'
      - 'BACKEND_BRANCH=${_BACKEND_BRANCH}'
      - '--build-arg'
      - 'FRONTEND_BRANCH=${_FRONTEND_BRANCH}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fabriq:latest'
      - '.'

  # Push to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/fabriq:latest']

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _GH_TOKEN: ''
  _BACKEND_BRANCH: 'demo'
  _FRONTEND_BRANCH: 'demo'

timeout: '1200s'
