# Build production image and deploy to Cloud Run.
# Manual: gcloud builds submit --config=cloudbuild.yaml --substitutions="_GH_TOKEN=${GH_TOKEN}" .
# Auto: create a trigger on push to main (see docs/BUILD_AND_DEPLOY.md § "Git trigger").


steps:
  # Clone backend (demo branch)
  - name: 'gcr.io/cloud-builders/git'
    args: ['clone', '--branch', 'demo', '--depth', '1',
           'https://${_GH_TOKEN}@github.com/fabriq-labs/fabriq-base.git',
           'backend']

  # Clone frontend (demo branch)
  - name: 'gcr.io/cloud-builders/git'
    args: ['clone', '--branch', 'demo', '--depth', '1',
           'https://${_GH_TOKEN}@github.com/fabriq-labs/zeiv-v2.git',
           'frontend-1']

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'Dockerfile', '-t', 'gcr.io/$PROJECT_ID/fabriq:latest', '.']

  # Push to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/fabriq:latest']

  # Deploy to Cloud Run (env vars remain from previous deploy or set in Console)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/fabriq:latest'
      - '--platform=managed'
      - '--region=${_REGION}'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/fabriq:latest'

options:
  machineType: 'E2_HIGHCPU_8'  
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _GH_TOKEN: ''
  _REGION: 'asia-southeast1'
  _SERVICE_NAME: 'fabriq'

timeout: '1200s'
