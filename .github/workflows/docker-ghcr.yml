# Build the root Dockerfile and push to GitHub Container Registry (GHCR).
# Replaces the Docker build + push portion of cloudbuild.yaml (Artifact Registry).
# Cloud Run deploy is not included; use gcloud/cloud-deploy or a separate workflow with GCP auth.
#
# Required repo secret:
#   GH_TOKEN — PAT with read access to fabriq-labs/fabriq-base and fabriq-labs/zeiv-v2 (same as Cloud Build _GH_TOKEN).
#
# GITHUB_TOKEN is used to log in to ghcr.io; enable "Packages: write" via permissions below.

name: Docker build and push (GHCR)

on:
  workflow_dispatch:
    inputs:
      backend_branch:
        description: Backend branch (fabriq-base)
        default: demo
        type: string
      frontend_branch:
        description: Frontend branch (zeiv-v2)
        default: knack-dev
        type: string
  push:
    branches:
      - demo
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set clone branches (workflow_dispatch overrides)
        id: branches
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=${{ inputs.backend_branch }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ inputs.frontend_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "backend=feature/gcloud-no-key" >> "$GITHUB_OUTPUT"
            echo "frontend=demo" >> "$GITHUB_OUTPUT"
          fi

      - name: Image name (GHCR requires lowercase)
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=knack-dev,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GH_TOKEN=${{ secrets.GH_TOKEN }}
            BACKEND_BRANCH=${{ steps.branches.outputs.backend }}
            FRONTEND_BRANCH=${{ steps.branches.outputs.frontend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
