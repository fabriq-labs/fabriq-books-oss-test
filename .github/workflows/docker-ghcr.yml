# Build the root Dockerfile and push to GitHub Container Registry (GHCR).
# Monorepo: no clone token; context includes backend/ and frontend-1/.
# GITHUB_TOKEN is used to log in to ghcr.io; enable "Packages: write" via permissions below.

name: Docker build and push (GHCR)

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: Skip Docker layer cache (fresh build)
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Monorepo git metadata for image labels
        id: git_meta
        run: |
          MSG_B64=$(git log -1 --format=%B | base64 -w0)
          COMMIT_DATE=$(git log -1 --format=%cI)
          echo "msg_b64=${MSG_B64}" >> "$GITHUB_OUTPUT"
          echo "commit_date=${COMMIT_DATE}" >> "$GITHUB_OUTPUT"

      - name: Image build metadata (time + tag)
        id: build_meta
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TAG_TS=$(date -u +%Y%m%d-%H%M%S)
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SAFE_REF}-${TAG_TS}" >> "$GITHUB_OUTPUT"

      - name: Image name (GHCR requires lowercase)
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ steps.build_meta.outputs.image_tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REF=${{ github.ref_name }}
            SOURCE_COMMIT=${{ github.sha }}
            SOURCE_COMMIT_MESSAGE_B64=${{ steps.git_meta.outputs.msg_b64 }}
            SOURCE_COMMIT_DATE=${{ steps.git_meta.outputs.commit_date }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
            IMAGE_TAG=${{ steps.build_meta.outputs.image_tag }}
            CACHEBUST=${{ github.sha }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache || false }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
