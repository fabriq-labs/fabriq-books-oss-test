# Deploy the `prod` branch image to the Railway prod service.
# Run from the `prod` branch: Actions → Deploy (prod) → Run workflow.

name: Deploy (prod)

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: Skip Docker layer cache (fresh build)
        default: false
        type: boolean

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require prod branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "prod" ]; then
            echo "This workflow must be run from the 'prod' branch (got '${GITHUB_REF_NAME}')." >&2
            exit 1
          fi

  deploy:
    needs: guard
    uses: ./.github/workflows/deploy-railway.yml
    with:
      service_id: 36f474f5-fc9f-4ab7-866b-61800eb3c318
      no_cache: ${{ inputs.no_cache }}
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    # Top-level caller must grant what nested reusable jobs request (GHCR push).
    permissions:
      contents: read
      packages: write
