# Build the root Dockerfile, push it to GHCR, and redeploy the Railway service.
# Run from the prod branch: Actions → Deploy (Railway) → Run workflow.
#
# Fork / first-time setup (secrets, GHCR image service, checklist):
#   docs/infrastructure/DEPLOY_RAILWAY.md  — Path B
#
# Secrets:
#   RAILWAY_TOKEN      — Railway project token
#   RAILWAY_SERVICE_ID — service to redeploy
#
# The Railway service is a Docker Image source pointed at
# ghcr.io/<owner>/<repo>:prod-latest, with registry credentials that can read packages.
# `railway redeploy --from-source` pulls the new digest of that tag.

name: Deploy (Railway)

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: Skip Docker layer cache (fresh build)
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require prod branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "prod" ]; then
            echo "This workflow must be run from the 'prod' branch (got '${GITHUB_REF_NAME}')." >&2
            exit 1
          fi

  build-push:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
      stable_tag: ${{ steps.build_meta.outputs.stable_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Monorepo git metadata for image labels
        id: git_meta
        run: |
          MSG_B64=$(git log -1 --format=%B | base64 -w0)
          COMMIT_DATE=$(git log -1 --format=%cI)
          echo "msg_b64=${MSG_B64}" >> "$GITHUB_OUTPUT"
          echo "commit_date=${COMMIT_DATE}" >> "$GITHUB_OUTPUT"

      - name: Image build metadata (time + tag)
        id: build_meta
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TAG_TS=$(date -u +%Y%m%d-%H%M%S)
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SAFE_REF}-${TAG_TS}" >> "$GITHUB_OUTPUT"
          echo "stable_tag=${SAFE_REF}-latest" >> "$GITHUB_OUTPUT"

      - name: Image name (GHCR requires lowercase)
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ steps.build_meta.outputs.image_tag }}
            type=raw,value=${{ steps.build_meta.outputs.stable_tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REF=${{ github.ref_name }}
            SOURCE_COMMIT=${{ github.sha }}
            SOURCE_COMMIT_MESSAGE_B64=${{ steps.git_meta.outputs.msg_b64 }}
            SOURCE_COMMIT_DATE=${{ steps.git_meta.outputs.commit_date }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
            IMAGE_TAG=${{ steps.build_meta.outputs.image_tag }}
            CACHEBUST=${{ github.sha }}
          no-cache: ${{ inputs.no_cache }}
          cache-from: |
            type=gha,scope=fabriq-docker
            type=registry,ref=${{ steps.image.outputs.image }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=fabriq-docker
            type=registry,ref=${{ steps.image.outputs.image }}:buildcache,mode=max,ignore-error=true
          provenance: false
          sbom: false
          platforms: linux/amd64

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Redeploy Railway service (pull latest image digest)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          STABLE_TAG: ${{ needs.build-push.outputs.stable_tag }}
          IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          set -euo pipefail

          RAILWAY_TOKEN="$(printf '%s' "${RAILWAY_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SERVICE_ID="$(printf '%s' "${SERVICE_ID:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          export RAILWAY_TOKEN

          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "Missing secret RAILWAY_TOKEN" >&2
            echo "Create a Project Token: Railway → Project → Settings → Tokens" >&2
            exit 1
          fi
          if [ -z "${SERVICE_ID}" ]; then
            echo "Missing secret RAILWAY_SERVICE_ID" >&2
            exit 1
          fi

          echo "Built ${IMAGE}:${STABLE_TAG} — redeploying the Railway service from RAILWAY_SERVICE_ID"
          echo "Railway must already point at ${IMAGE}:${STABLE_TAG}."

          if ! npx -y @railway/cli@latest redeploy \
            --service "${SERVICE_ID}" \
            --from-source \
            --yes; then
            echo >&2
            echo "Redeploy failed. Check that RAILWAY_SERVICE_ID exists in the project" >&2
            echo "bound to RAILWAY_TOKEN, and that the service image is ${IMAGE}:${STABLE_TAG}." >&2
            exit 1
          fi
