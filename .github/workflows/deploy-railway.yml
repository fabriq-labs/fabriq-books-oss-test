# Build the GHCR image (via docker-ghcr.yml) and redeploy a Railway Docker-image service.
#
# Flow (Option B — mutable tag + CLI redeploy):
#   1. Build/push image tags including <branch>-latest (e.g. demo-latest)
#   2. railway redeploy pulls that tag again and picks up the new digest
#
# Required repo secrets:
#   RAILWAY_TOKEN       - Railway project token (Project Settings → Tokens)
#   RAILWAY_SERVICE_ID  - Railway service name or ID to redeploy
#
# One-time Railway UI setup:
#   Service source = "Deploy from Docker Image"
#   Image          = ghcr.io/<owner>/<repo>:<branch>-latest  (e.g. ...:demo-latest)
#   Registry creds = GitHub PAT with read:packages (private GHCR)

name: Build and deploy (Railway)

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: Skip Docker layer cache (fresh build)
        default: false
        type: boolean

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/docker-ghcr.yml
    with:
      no_cache: ${{ inputs.no_cache }}
    permissions:
      contents: read
      packages: write

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Redeploy Railway service (pull latest image digest)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          STABLE_TAG: ${{ needs.build.outputs.stable_tag }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail

          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "Missing secret RAILWAY_TOKEN" >&2
            exit 1
          fi
          if [ -z "${RAILWAY_SERVICE_ID:-}" ]; then
            echo "Missing secret RAILWAY_SERVICE_ID" >&2
            exit 1
          fi

          echo "Built ${IMAGE}:${STABLE_TAG} — redeploying Railway service ${RAILWAY_SERVICE_ID}"
          echo "Railway must already point at ${IMAGE}:${STABLE_TAG} (or the same mutable tag for this branch)."

          npx -y @railway/cli@latest redeploy \
            --service "${RAILWAY_SERVICE_ID}" \
            --yes
